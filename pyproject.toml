[project]
name = "humanoid-fleet-control"
version = "0.1.0"
description = "Prototype hierarchical orchestration system for humanoid robot fleets."
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
